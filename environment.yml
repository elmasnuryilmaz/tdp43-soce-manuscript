# Bioinformatic tools used, with the versions verified on the study machine.
# R 4.3.2 with DESeq2 1.42.1, FRASER 1.14.1, sva 3.50.0, data.table 1.17.0,
# GenomicAlignments 1.38.2, Rsamtools 2.18.0, BiocParallel 1.36.0, SummarizedExperiment 1.32.0,
# IsoformSwitchAnalyzeR 2.6.0, DRIMSeq 1.34.0, stageR 1.28.0.
name: tdp43-soce
channels: [bioconda, conda-forge]
dependencies:
  - sra-tools=3.2.1
  - fastqc=0.12.1
  - trim-galore=0.6.11
  - cutadapt=5.2
  - hisat2=2.2.2
  - samtools=1.23
  - subread=2.1.1
  - multiqc=1.25.1
  - rmats=4.3.0
  - salmon=1.11.4
  - regtools=1.0.0
  - bedtools=2.31.1
