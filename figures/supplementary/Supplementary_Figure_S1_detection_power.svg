  <g id="axes_2">
   <g id="text_22">
    <text style="fill: #222222; font: 7px 'Arial'" transform="translate(48.852 284.42645)">Simulation assumptions (an example, not the rMATS analysis)</text>
    <text style="fill: #222222; font: 7px 'Arial'" transform="translate(48.852 293.288614)">• three versus three replicates; replicate PSI drawn from a normal distribution around 0.5 ± ΔPSI/2,</text>
    <text style="fill: #222222; font: 7px 'Arial'" transform="translate(48.852 302.068747)">   between-replicate SD 0.05, limited to 0.01–0.99</text>
    <text style="fill: #222222; font: 7px 'Arial'" transform="translate(48.852 310.84888)">• binomial read sampling at a fixed depth of 10, 20, 50 or 100 informative reads per sample</text>
    <text style="fill: #222222; font: 7px 'Arial'" transform="translate(48.852 319.711044)">• two-sample t test (equal variances) on PSI; a hit is p &lt; 0.05 without multiple-testing correction</text>
    <text style="fill: #222222; font: 7px 'Arial'" transform="translate(48.852 328.573208)">• 2,000 simulations per point; no FDR correction and no |ΔPSI| ≥ 0.10 threshold</text>
   </g>
  </g>
 </g>
