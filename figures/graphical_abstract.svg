<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1000" viewBox="0 0 2600 1000" role="img" aria-labelledby="title desc">
  <title id="title">TDP-43 knockdown: calcium-gene mRNAs rise while SOCE falls</title>
  <desc id="desc">Graphical abstract showing TDP-43 knockdown in SH-SY5Y cells, an 84.1 percent reduction in the store-operated calcium-entry response despite increased calcium-regulatory mRNAs, and cross-dataset RNA evidence that did not establish a single causal RNA-processing event.</desc>
  <defs>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#17365D"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D45A43"/>
    </marker>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill: #202A34; }
      .title { font-size: 60px; font-weight: 700; fill: #17365D; }
      .head { font-size: 45px; font-weight: 700; fill: #17365D; }
      .body { font-size: 36px; }
      .small { font-size: 30px; fill: #52606D; }
      .metric { font-size: 64px; font-weight: 700; }
      .gene { font-size: 31px; font-style: italic; }
      .fold { font-size: 31px; font-weight: 700; fill: #287D73; }
      .panel { stroke: #B8C4CE; stroke-width: 4; }
    </style>
  </defs>

  <rect width="2600" height="1000" fill="#FFFFFF"/>
  <text class="t title" x="1300" y="90" text-anchor="middle">TDP-43 knockdown: calcium-gene mRNAs rise while SOCE falls</text>
  <line x1="70" y1="130" x2="2530" y2="130" stroke="#17365D" stroke-width="5"/>

  <!-- Panel 1: perturbation -->
  <rect class="panel" x="65" y="180" width="510" height="680" rx="35" fill="#EAF3F8"/>
  <text class="t head" x="320" y="245" text-anchor="middle">TDP-43 knockdown</text>

  <ellipse cx="320" cy="445" rx="155" ry="115" fill="#FFFFFF" stroke="#2F75B5" stroke-width="9"/>
  <circle cx="320" cy="445" r="64" fill="#CFE3F1" stroke="#17365D" stroke-width="6"/>
  <text class="t body" x="320" y="458" text-anchor="middle" font-weight="700" fill="#17365D">TDP-43</text>
  <text class="t body" x="125" y="350" fill="#D45A43" font-weight="700">shRNA</text>
  <line x1="195" y1="365" x2="252" y2="404" stroke="#D45A43" stroke-width="8" marker-end="url(#arrowOrange)"/>
  <text class="t body" x="320" y="600" text-anchor="middle" font-weight="700">SH-SY5Y cells</text>
  <text class="t small" x="320" y="645" text-anchor="middle">lentiviral shTDP-43</text>

  <rect x="115" y="690" width="410" height="120" rx="25" fill="#FFFFFF" stroke="#D45A43" stroke-width="5"/>
  <text class="t body" x="320" y="735" text-anchor="middle"><tspan font-style="italic">TARDBP</tspan> mRNA</text>
  <text class="t metric" x="320" y="795" text-anchor="middle" fill="#D45A43">↓94.4%</text>
  <text class="t small" x="320" y="842" text-anchor="middle">vs non-targeting shRNA; n = 4</text>

  <line x1="590" y1="520" x2="655" y2="520" stroke="#17365D" stroke-width="9" marker-end="url(#arrowNavy)"/>

  <!-- Panel 2: opposing readouts -->
  <rect class="panel" x="680" y="180" width="930" height="680" rx="35" fill="#FFFFFF"/>
  <text class="t head" x="1145" y="245" text-anchor="middle">Opposing cellular readouts</text>

  <rect x="725" y="305" width="350" height="270" rx="28" fill="#EAF3F8" stroke="#2F75B5" stroke-width="5"/>
  <text class="t body" x="900" y="365" text-anchor="middle" font-weight="700" fill="#17365D">SOCE response</text>
  <text class="t metric" x="900" y="465" text-anchor="middle" fill="#2F75B5">↓84.1%</text>
  <text class="t small" x="900" y="525" text-anchor="middle">p = 0.0115; n = 3</text>

  <text class="t" x="1125" y="470" text-anchor="middle" font-size="90" font-weight="700" fill="#17365D">≠</text>

  <rect x="1180" y="305" width="385" height="390" rx="28" fill="#FBEDE8" stroke="#D45A43" stroke-width="5"/>
  <text class="t body" x="1372" y="360" text-anchor="middle" font-weight="700" fill="#D45A43">mRNA by RT-qPCR</text>

  <text class="t gene" x="1210" y="430">TRPC1</text><rect x="1320" y="405" width="62" height="32" fill="#287D73"/><text class="t fold" x="1535" y="432" text-anchor="end">1.8×</text>
  <text class="t gene" x="1210" y="495">STIM1</text><rect x="1320" y="470" width="65" height="32" fill="#287D73"/><text class="t fold" x="1535" y="497" text-anchor="end">1.9×</text>
  <text class="t gene" x="1210" y="560">ORAI1</text><rect x="1320" y="535" width="58" height="32" fill="#287D73"/><text class="t fold" x="1535" y="562" text-anchor="end">1.7×</text>
  <text class="t gene" x="1210" y="625">ATP2A3</text><rect x="1320" y="600" width="110" height="32" fill="#287D73"/><text class="t fold" x="1535" y="627" text-anchor="end">3.2×</text>
  <text class="t small" x="1372" y="675" text-anchor="middle">all increased; n = 4</text>

  <rect x="725" y="740" width="840" height="75" rx="22" fill="#E8F3F1" stroke="#287D73" stroke-width="5"/>
  <text class="t body" x="1145" y="790" text-anchor="middle" font-weight="700" fill="#287D73">mRNA abundance did not predict SOCE function</text>

  <line x1="1625" y1="520" x2="1690" y2="520" stroke="#17365D" stroke-width="9" marker-end="url(#arrowNavy)"/>

  <!-- Panel 3: integrated RNA evidence -->
  <rect class="panel" x="1715" y="180" width="820" height="680" rx="35" fill="#E8F3F1"/>
  <text class="t head" x="2125" y="245" text-anchor="middle">Cross-dataset RNA analysis</text>

  <g stroke="#287D73" stroke-width="8" stroke-linecap="round">
    <line x1="1790" y1="330" x2="1920" y2="330"/><line x1="1790" y1="365" x2="1920" y2="365"/>
    <line x1="1790" y1="400" x2="1920" y2="400"/><line x1="1790" y1="435" x2="1920" y2="435"/>
    <line x1="1790" y1="470" x2="1920" y2="470"/><line x1="1790" y1="505" x2="1920" y2="505"/>
  </g>
  <g fill="#287D73">
    <circle cx="1760" cy="330" r="11"/><circle cx="1760" cy="365" r="11"/><circle cx="1760" cy="400" r="11"/>
    <circle cx="1760" cy="435" r="11"/><circle cx="1760" cy="470" r="11"/><circle cx="1760" cy="505" r="11"/>
  </g>
  <text class="t body" x="1970" y="390" font-weight="700">6 public TDP-43</text>
  <text class="t body" x="1970" y="440">depletion models</text>

  <rect x="1770" y="555" width="710" height="90" rx="22" fill="#FFFFFF" stroke="#287D73" stroke-width="5"/>
  <text class="t body" x="2125" y="612" text-anchor="middle" font-weight="700" fill="#287D73">Recurrent <tspan font-style="italic">CBARP</tspan> splicing</text>

  <rect x="1770" y="680" width="710" height="125" rx="22" fill="#FFFFFF" stroke="#B8C4CE" stroke-width="4"/>
  <text class="t body" x="2125" y="730" text-anchor="middle" font-weight="700">No single RNA-processing event</text>
  <text class="t body" x="2125" y="775" text-anchor="middle">explained the SOCE decrease</text>

</svg>
